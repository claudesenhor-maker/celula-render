<!doctype html>
<!-- O PALCO do motor web (13/10, HISTORICO §109). `render_web.mjs` abre esta
     pagina no Chrome headless, chama `preparar(spec)` uma vez e `quadro(t)` a
     cada frame, e le o canvas. As fontes vem do Google Fonts e sao esperadas
     antes do primeiro quadro (fonte que chega no meio troca o desenho). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rye&family=Lilita+One&family=Cinzel:wght@700&family=Oswald:wght@600&display=block">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="tela" width="1080" height="1920"></canvas>
<script src="node_modules/three/build/three.min.js"></script>
<script src="comum.js"></script>
<script src="estilos/mangueira.js"></script>
<script src="estilos/silhueta.js"></script>
<script src="estilos/pixel.js"></script>
<script src="estilos/lowpoly.js"></script>
<script src="estilos/mecanismo.js"></script>
<script src="estilos/escala.js"></script>
<script>
let MOTOR = null;
window.preparar = async function (spec) {
  const tela = document.getElementById('tela');
  tela.width = spec.w; tela.height = spec.h;
  const fontes = ['16px "Press Start 2P"', '40px Rye', '40px "Lilita One"', '700 40px Cinzel', '600 40px Oswald'];
  try { await Promise.all(fontes.map((f) => document.fonts.load(f))); await document.fonts.ready; } catch (e) { console.log('[palco] fontes: ' + e); }
  const m = MOTORES[spec.estilo];
  if (!m) throw new Error('estilo desconhecido: ' + spec.estilo + ' (tem: ' + Object.keys(MOTORES).join(', ') + ')');
  MOTOR = m.criar(tela, spec, U);
  // `acoes`: o evento que o estilo DESENHA em cada cena (o lowpoly troca a acao
  // que contradiz a frase); o montar_web poe o som do evento desenhado.
  return { ok: true, fontes: fontes.map((f) => document.fonts.check(f)), acoes: spec.cenas.map((c) => c.acaoV2 || null) };
};
window.quadro = function (t, formato, qualidade) {
  MOTOR.quadro(t);
  return document.getElementById('tela').toDataURL(formato || 'image/jpeg', qualidade || 0.92);
};
</script>
</body></html>
