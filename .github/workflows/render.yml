name: render-palito

# Disparado pelo n8n via repository_dispatch.
# Repositorio PUBLICO = minutos ilimitados e gratuitos.
on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
    inputs:
      spec_url:     { description: 'URL do spec.json (ou use o payload inline)', required: false }
      callback_url: { description: 'Webhook do n8n',   required: false }
      modo_tts:     { description: 'real ou demo',     required: false, default: 'real' }

jobs:
  render:
    runs-on: ubuntu-latest
    # 90 MIN (30/08). Eram 18, escolhidos quando o Wait do n8n esperava 20 --
    # e esse Wait nao existe mais: o Adapter de Montagem dispara e marca
    # `aguardando_render`, e quem repesca e o Dispatcher, pelo banco. O teto
    # que importa hoje e o da Manutencao Diaria, que reverte item preso ha
    # mais de 2h.
    #
    # A esquete passou a ter 40 a 80 s (era 15 a 25). A 24 fps isso e de 960
    # a 1920 frames, e o render gasta ~1,5 s por frame: um video no teto do
    # formato leva perto de 45 min, contra os ~13 que um de 17 s levava.
    # Deixar 18 aqui faria todo video longo morrer no meio -- e o job morre
    # calado, com o item preso ate a Manutencao do dia seguinte.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencias do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2

      - name: Dependencias Python
        run: pip install --quiet -r requirements.txt

      - name: Render
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET:      toonzueira
          SPEC_URL:     ${{ github.event.client_payload.spec_url     || inputs.spec_url }}
          # Spec embutido no repository_dispatch. Preferido: ~2 KB cabem no
          # payload e some a etapa de upload no Storage. toJSON preserva o
          # objeto como string JSON valida.
          SPEC_JSON:    ${{ toJSON(github.event.client_payload.spec) }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url }}
          MODO_TTS:     ${{ github.event.client_payload.modo_tts     || inputs.modo_tts || 'real' }}
          FILA_ID:      ${{ github.event.client_payload.fila_id }}
          # Voz: opt-in. Sem ELEVEN_API_KEY o render segue no Edge-TTS.
          # O Voice ID NAO fica aqui: vem do identidade_json do canal, porque
          # nao e segredo e muda por canal. Este e so a rede de seguranca
          # para quando a identidade nao trouxer nenhum.
          ELEVEN_API_KEY:  ${{ secrets.ELEVEN_API_KEY }}
          # SEGUNDA CONTA (07/09). A ordem de gasto e 1 -> 2 -> Edge, e ela
          # vive em `palito_v5._chaves_eleven`. Os creditos da ElevenLabs nao
          # acumulam de um mes para o outro: gastar sempre a mesma conta
          # primeiro esvazia uma enquanto a outra expira sem uso.
          ELEVEN_API_KEY_2: ${{ secrets.ELEVEN_API_KEY_2 }}
          # TERCEIRA VAGA (10/09). Ela existe porque o secret que nao chega e
          # invisivel: em 10/09 o dono escreveu *"adicionei a chave do
          # elevenlabs no GitHub, porem video continua com a voz free"*, e o
          # log do run 243 mostrou `ELEVEN_API_KEY_2:` VAZIO -- a chave nova
          # nao estava em nenhuma das duas vagas que este arquivo encaminha.
          #
          # Secret que o `render.yml` nao cita nao existe para o runner, por
          # mais certa que a chave esteja no cofre do GitHub. Tres vagas cobrem
          # a conta que renova, a segunda conta e a chave de emergencia sem que
          # o dono precise de um PAT com escopo `workflow` para acrescentar uma
          # linha aqui -- que e' exatamente o que ele NAO tem (§5.1).
          ELEVEN_API_KEY_3: ${{ secrets.ELEVEN_API_KEY_3 }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          # O DEGRAU DO MEIO (09/09, ordem do dono: "mantenha o elevenlabs, e
          # use o outro caso acabe"). A cadeia agora e
          # ElevenLabs -> Azure -> Edge, e ela vive em `palito_v5.sintetizar`.
          #
          # Ate aqui, quando o credito da ElevenLabs acabava -- e ele acabou em
          # 04/09 -- o video caia direto no Edge, que e a voz que o dono ja
          # mandou corrigir duas vezes. O Azure cobra por CARACTERE em vez de
          # assinatura, e os 38.160 caracteres de um mes a 3 videos/dia cabem
          # inteiros no free tier de 500 mil.
          #
          # Sem estes dois secrets o degrau nao existe e a cadeia volta a ser
          # ElevenLabs -> Edge, como era: e opt-in, igual a todo o resto do
          # bloco de voz.
          #
          # A VOZ NAO FICA AQUI, pelo mesmo motivo do ELEVEN_VOICE_ID: ela vem
          # do perfil em `identidade_json.audio.vozes` (`azure_voice`), porque
          # nao e segredo e muda por personagem. Sem `azure_voice`, o degrau
          # usa a voz do Edge (`voice`) -- o que conserta a LICENCA, ja que o
          # endpoint do Edge-TTS e o do navegador e nao uma API publica, mas
          # nao muda a qualidade: sao as mesmas vozes neurais.
          AZURE_SPEECH_KEY:    ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          # ARTE SOB DEMANDA (28/08). O cenario que o roteiro pediu e que
          # ninguem desenhou e gerado aqui mesmo, durante o render: ele vai
          # para assets_bruto e nao passa por rembg (rembg destroi cenario),
          # entao custa ~20s e ja entra no video de hoje. Ver sob_demanda.py.
          #
          # OBJETO nao segue por este caminho: ele precisa de alfa, alfa vem
          # do rembg e o rembg so roda no Action `assets`. Objeto faltante e
          # ENCOMENDADO em assets_pendentes e chega no video seguinte.
          #
          # Sem o secret o modulo avisa no log e o motor cai no cenario mais
          # parecido do catalogo, como sempre fez: a producao nao quebra, so
          # deixa de crescer o catalogo.
          CF_API_TOKEN:   ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID:  04483caa8b5f9674b84399fcdd1ef9d5
        run: python job.py

      - name: Guardar o MP4 como artefato (util para depurar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: /tmp/final.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Avisar o n8n se o job falhou
        # Sem isto, uma falha aqui deixa o Wait pendurado e o item preso — o
        # mesmo bug de "item preso" do §6 do HANDOFF.
        if: failure()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url }}
        run: |
          if [ -n "$CALLBACK_URL" ]; then
            curl -s -X POST "$CALLBACK_URL" -H 'Content-Type: application/json' \
              -d "{\"status\":\"erro\",\"erro_msg\":\"job ${{ github.run_id }} falhou\",\"fila_id\":\"${{ github.event.client_payload.fila_id }}\"}" || true
          fi
