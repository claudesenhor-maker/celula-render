name: validar-mineracao
on:
  pull_request:
    paths: ['mineracao/**', 'tests/test_mineracao.py', '.github/workflows/mineracao.yml']
  push:
    branches: [main]
    paths: ['mineracao/**', 'tests/test_mineracao.py', '.github/workflows/mineracao.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contratos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_mineracao.py
